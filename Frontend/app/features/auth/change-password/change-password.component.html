<div class="page-header">
  <h1>Change Password</h1>
  <p class="page-subtitle">Update the password for your own account.</p>
</div>

<div class="table-card password-form">
  @if (error()) { <p class="state-message state-error">{{ error() }}</p> }
  @if (success()) { <p class="state-message state-success">Password changed successfully.</p> }

  <label>Current Password
    <input type="password" class="text-input" autocomplete="current-password"
      [ngModel]="currentPassword()" (ngModelChange)="currentPassword.set($event)" />
  </label>
  <label>New Password
    <input type="password" class="text-input" autocomplete="new-password"
      [ngModel]="newPassword()" (ngModelChange)="newPassword.set($event)" />
  </label>
  <label>Confirm New Password
    <input type="password" class="text-input" autocomplete="new-password"
      [ngModel]="confirmPassword()" (ngModelChange)="confirmPassword.set($event)" />
  </label>

  <button class="btn-primary" (click)="submit()" [disabled]="saving()">
    {{ saving() ? 'Saving…' : 'Change Password' }}
  </button>
</div>
